spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soundstore_dev}
    username: ${DB_USERNAME:soundstore}
    password: ${DB_PASSWORD:soundstore}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always
